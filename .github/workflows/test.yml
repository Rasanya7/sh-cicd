name: Python CI Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint and Syntax Check
        run: |
          python -m py_compile demo_repo/calculator.py

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s demo_repo -p "test_*.py"

      - name: Notify SH-CICD Self-Healing Webhook on Failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.SH_CICD_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.SH_CICD_WEBHOOK_SECRET }}
        run: |
          curl -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=demo" \
            -d "{\"repository\": \"${{ github.repository }}\", \"workflow\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"status\": \"failed\"}"
